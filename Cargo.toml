[workspace]
resolver = "2"
members = ["engine", "engine-wasm", "sim", "api"]

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
engine = { path = "engine" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
rustc-hash = "2.1.3"
thiserror = "2.0.21"
tsify = { version = "0.5.8", default-features = false, features = ["js"] }
wasm-bindgen = "0.2.129"
serde-wasm-bindgen = "0.6.5"
js-sys = "0.3.106"
proptest = "1.12.0"
criterion = "0.8.2"
rand = "0.10.3"
rand_chacha = "0.10.0"
clap = { version = "4.6.7", features = ["derive"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Los tests recorren recursiones grandes; optimizar también en dev/test.
[profile.dev]
opt-level = 1
# Sin la información de depuración completa (variables, tipos) target/debug ocupa varias
# veces menos; los backtraces siguen con archivo y línea.
debug = "line-tables-only"

[profile.test]
opt-level = 3
