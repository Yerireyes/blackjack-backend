# Imagen de producción (front + API) en GitHub Container Registry y aviso a Render para que
# la despliegue. Corre con cada push a main, a mano (Actions → Despliegue → Run workflow;
# por ejemplo después de cambiar el front) o cuando el repo del front lo pide con un
# repository_dispatch de tipo frontend-updated.
#
# Secretos del repo (Settings → Secrets and variables → Actions), los dos opcionales:
# - FRONTEND_REPO_TOKEN: solo si el repo del front es privado (token de solo lectura).
# - RENDER_DEPLOY_HOOK: la URL del Deploy Hook del servicio en Render. Sin ella solo se
#   publica la imagen.
name: Despliegue

on:
  push:
    branches: [main]
  workflow_dispatch:
  repository_dispatch:
    types: [frontend-updated]

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  image:
    name: Imagen y despliegue
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      # Los dos repos lado a lado, como en desarrollo: el front enlaza ../Backend.
      - uses: actions/checkout@v4
        with:
          path: backend
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/blackjack-frontend
          ref: main
          path: frontend
          token: ${{ secrets.FRONTEND_REPO_TOKEN || github.token }}

      - name: Nombre de la imagen
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/blackjack" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          build-contexts: frontend-src=frontend
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Desplegar en Render
        if: env.RENDER_DEPLOY_HOOK != ''
        run: |
          img=$(jq -rn --arg v "$IMAGE:${{ github.sha }}" '$v|@uri')
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK&imgURL=$img" > /dev/null
          echo "Render despliega $IMAGE:${{ github.sha }}"
